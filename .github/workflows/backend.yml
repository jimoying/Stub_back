name: Short Links Backend

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the image to GHCR after checks pass
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Go backend
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 3. 下载依赖
        run: go mod download

      - name: 4. 检查 Go 格式
        shell: bash
        run: |
          unformatted="$(find . -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf '以下 Go 文件未通过 gofmt：\n%s\n' "$unformatted"
            exit 1
          fi

      - name: 5. 静态分析
        run: go vet ./...

      - name: 6. 单元测试
        run: go test -race ./...

  container:
    name: Build and publish container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 QEMU 多架构支持
        uses: docker/setup-qemu-action@v3

      - name: 3. 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. 登录 GitHub Container Registry
        if: >-
          (github.event_name == 'push' &&
            (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
             startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_image == true &&
            (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
             startsWith(github.ref, 'refs/tags/v')))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. 生成镜像标签和元数据
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/short-links-back
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 6. 构建镜像；满足发布条件时推送到 GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: >-
            ${{ (github.event_name == 'push' &&
              (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
               startsWith(github.ref, 'refs/tags/v'))) ||
              (github.event_name == 'workflow_dispatch' && inputs.publish_image == true &&
               (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
                startsWith(github.ref, 'refs/tags/v'))) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=short-links-back
          cache-to: type=gha,mode=max,scope=short-links-back
